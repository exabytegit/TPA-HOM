<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TPA-HOM Planes de Ahorro</title>
    <link rel="stylesheet" href="/test-planes.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">TPA-HOM / Sandbox local</p>
        <h1>Planes de Ahorro</h1>
        <p>Toyota Plan: Pensado para vos</p>
      </header>

      <details class="sandbox-tools">
        <summary>Herramientas sandbox</summary>
        <div class="sandbox-tools-content">
          <button id="test-all-button" class="btn btn-secondary" disabled>Probar todos</button>
          <button id="reset-button" class="btn btn-secondary" disabled>Limpiar resultados</button>
          <p id="load-status">Cargando catalogo de prueba...</p>
        </div>
      </details>

      <section id="cards-grid" class="cards-grid" aria-live="polite">
        <article class="empty-card">
          <h2>Esperando catalogo</h2>
          <p>Cuando se cargue /api/dev/catalog van a aparecer los planes disponibles.</p>
        </article>
      </section>
    </main>

    <script src="/test-planes.js" defer></script>
  </body>
</html>
